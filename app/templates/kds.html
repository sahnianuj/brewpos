{% extends "base.html" %}
{% block title %}{{ station_label }} KDS - Brew POS Demo{% endblock %}
{% block content %}
<h1>{{ station_label }} <span class="muted" style="font-weight:400; font-size:1rem">Kitchen Display</span></h1>
<div class="controls-row">
  <label>Store
    <select id="storeSelect"></select>
  </label>
  <label>Signed in as
    <select id="actorSelect"></select>
  </label>
</div>
<div id="queue" class="grid board-grid"></div>
{% endblock %}
{% block scripts %}
<script>window.STATION = {{ station | tojson }};</script>
<script type="module" src="/static/js/kds.js"></script>
{% endblock %}
